    <rect x="58" y="321" width="250" height="111" rx="16" fill="#15101d" stroke="#352743"/><text x="82" y="360" fill="#a99db5" font-size="14">WIN RATE</text><text x="82" y="407" fill="#f4effa" font-size="32" font-weight="750">—</text>
    <rect x="336" y="321" width="250" height="111" rx="16" fill="#15101d" stroke="#352743"/><text x="360" y="360" fill="#a99db5" font-size="14">PROFIT FACTOR</text><text x="360" y="407" fill="#f4effa" font-size="32" font-weight="750">—</text>
    <rect x="614" y="321" width="250" height="111" rx="16" fill="#15101d" stroke="#352743"/><text x="638" y="360" fill="#a99db5" font-size="14">REALIZED PNL</text><text x="638" y="407" fill="#f4effa" font-size="32" font-weight="750">—</text>
    <rect x="892" y="321" width="250" height="111" rx="16" fill="#15101d" stroke="#352743"/><text x="916" y="360" fill="#a99db5" font-size="14">CLOSED POSITIONS</text><text x="916" y="407" fill="#f4effa" font-size="32" font-weight="750">0</text>
  </g>
  <rect x="58" y="457" width="690" height="284" rx="18" fill="#15101d" stroke="#352743"/>
  <text x="86" y="498" fill="#f4effa" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Cumulative realized PnL</text>
  <text x="86" y="525" fill="#a99db5" font-family="Inter,Arial,sans-serif" font-size="13">Chart appears when the analysis contains closed positions.</text>
  <path d="M98 680H708" stroke="#3b2a4a" stroke-width="2" stroke-dasharray="6 7"/><path d="M98 654H708" stroke="#281d33"/><path d="M98 627H708" stroke="#281d33"/><path d="M98 600H708" stroke="#281d33"/>
  <text x="86" y="711" fill="#8d8097" font-family="Inter,Arial,sans-serif" font-size="12">Illustrative empty-data state</text>
