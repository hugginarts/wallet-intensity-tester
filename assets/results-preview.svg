  <text x="803" y="498" fill="#f4effa" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Coverage &amp; data quality</text>
  <circle cx="812" cy="544" r="5" fill="#a78bfa"/><text x="830" y="549" fill="#d8cfe0" font-family="Inter,Arial,sans-serif" font-size="14">Transactions reviewed</text><text x="1097" y="549" text-anchor="end" fill="#a99db5" font-family="Inter,Arial,sans-serif" font-size="14">shown in report</text>
  <circle cx="812" cy="584" r="5" fill="#a78bfa"/><text x="830" y="589" fill="#d8cfe0" font-family="Inter,Arial,sans-serif" font-size="14">Detected quote assets</text><text x="1097" y="589" text-anchor="end" fill="#a99db5" font-family="Inter,Arial,sans-serif" font-size="14">SOL / USD</text>
