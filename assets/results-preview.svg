    <linearGradient id="line" x1="180" y1="462" x2="1030" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1200" height="820" rx="30" fill="url(#bg)"/>
  <text x="58" y="65" fill="#d8b4fe" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">WALLET INTENSITY · REPORT OVERVIEW</text>
  <text x="58" y="117" fill="#fbf7ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Evidence before a copy decision</text>
  <text x="60" y="149" fill="#a99db5" font-family="Inter,Arial,sans-serif" font-size="16">Metrics depend on detected closed positions and the selected RPC history.</text>
  <rect x="58" y="179" width="1084" height="118" rx="18" fill="#20172d" stroke="#7051a2" stroke-width="2"/>
  <text x="86" y="222" fill="#c4a0ff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">INSUFFICIENT SAMPLE</text>
  <text x="86" y="257" fill="#d7cce0" font-family="Inter,Arial,sans-serif" font-size="16">Example state: too few closed trades to judge historical performance.</text>
  <rect x="86" y="273" width="1025" height="7" rx="3.5" fill="#3b2a4a"/><rect x="86" y="273" width="205" height="7" rx="3.5" fill="#a78bfa"/>
